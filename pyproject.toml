[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "switchyard"
version = "1.0.0"
description = "Runs heterogeneous batch operations concurrently behind a shared per-host rate limiter and circuit breaker, validating every response against a schema"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "click>=8.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[project.optional-dependencies]
browser = ["playwright>=1.44"]
excel = ["openpyxl>=3.1"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "openpyxl>=3.1",
]

[project.scripts]
switchyard = "parallel_ops.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/parallel_ops"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
